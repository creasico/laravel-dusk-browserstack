version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
    versioning-strategy: increase-if-necessary
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
    versioning-strategy: increase-if-necessary
    groups:
      dependencies:
        patterns: ['*']
